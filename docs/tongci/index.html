<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2A2DE0">
<title>同詞相遇・連線版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2A2DE0;--bg2:#1B1DA8;--ink:#11123B;--mut:#5D6092;--paper:#fff;--soft:#F0F0FF;--line:#D9DAF5;
  --y:#FFD43B;--yd:#D9A800;--p:#FF4F8B;--pd:#D62E69;--ok:#0A9A6C;--mix:#FF4220;
  --disp:"Unbounded","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
body::before{width:70vmax;height:70vmax;left:-28vmax;top:-22vmax;background:var(--p);opacity:.2}
body::after{width:64vmax;height:64vmax;right:-26vmax;bottom:-24vmax;background:var(--y);opacity:.16}
h1,h2,p,ol,ul{margin:0}
button,input{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.card :focus-visible,.modal :focus-visible{outline-color:var(--bg)}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 72px}
.card{background:var(--paper);border-radius:24px;padding:20px;box-shadow:0 10px 0 rgba(10,11,70,.28)}
.room{display:grid;gap:22px}
.room aside{display:grid;gap:22px;align-content:start;min-width:0}
.room main{min-width:0}
#hist:empty{display:none}
.card h2{font-size:19px;font-weight:900;line-height:1.3}
.mut{color:var(--mut);font-size:14px}
.center{text-align:center}

/* venn: the two circles that meet */
.venn{position:relative;isolation:isolate;--gap:22%;width:min(100%,360px);aspect-ratio:1.62;margin:0 auto}
.venn i{position:absolute;top:0;left:50%;height:100%;aspect-ratio:1;border-radius:50%;margin-left:calc(-0.5 * 100% / 1.62);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.venn .c1{background:var(--p);transform:translateX(calc(-1 * var(--gap)))}
.venn .c2{background:var(--y);mix-blend-mode:multiply;transform:translateX(var(--gap))}
.venn b{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;color:#fff;font-family:var(--disp);font-weight:900;line-height:1.1;text-shadow:0 .06em 0 var(--ink);padding:0 4%;word-break:break-all}

/* buttons */
.btn{appearance:none;border:0;border-radius:16px;min-height:50px;padding:12px 20px;font-size:17px;font-weight:700;line-height:1.2;cursor:pointer;color:var(--ink);background:var(--soft);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--y);box-shadow:0 4px 0 var(--yd)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--yd)}
.btn.pink{background:var(--p);color:#fff;box-shadow:0 4px 0 var(--pd)}
.btn.pink:active:not(:disabled){box-shadow:0 1px 0 var(--pd)}
.btn.block{display:block;width:100%;margin-top:14px}
.btn.small{min-height:36px;font-size:14px;padding:6px 14px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.btn.small.primary{box-shadow:0 3px 0 var(--yd)}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{appearance:none;border:0;background:none;color:var(--bg);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 0 0}

/* fields */
label,.lab{display:block;font-size:14px;font-weight:700;color:var(--mut);margin:0 0 8px}
input[type=text],input[type=number]{width:100%;min-height:54px;font-size:18px;font-weight:500;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:var(--bg);background:#fff}
input::placeholder{color:#9A9CC4}
.row{display:flex;gap:10px}.row>input{flex:1;min-width:0}
.err{color:var(--pd);font-size:14px;font-weight:700;margin-top:12px;white-space:pre-line}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:18px 0 14px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line);border-radius:1px}

/* home */
.home{display:grid;gap:22px;grid-template-areas:"hero" "panel" "how";padding-top:28px}
.hero{grid-area:hero;text-align:center;color:#fff}
.hero .venn{width:min(64%,240px)}
.hero h1{font-size:clamp(46px,14vw,64px);font-weight:900;letter-spacing:.06em;line-height:1.1;margin-top:10px}
.hero .tag{font-size:17px;font-weight:500;opacity:.92;margin-top:10px;line-height:1.6}
.panel{grid-area:panel}
.how{grid-area:how;color:#fff;list-style:none;padding:0;counter-reset:s;display:grid;gap:12px;font-size:15px}
.how li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;line-height:1.55}
.how li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--bg);font-family:var(--disp);font-weight:900;font-size:13px;display:grid;place-items:center;margin-top:-1px}
.how .note{opacity:.8;padding-left:40px}
.how .note::before{display:none}

/* room top bar */
.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:16px;flex-wrap:wrap}
.top .code{line-height:1.1}
.top .code span{display:block;font-size:12px;font-weight:500;opacity:.8;margin-bottom:3px}
.top .code b{font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.08em}
.top .sp{flex:1}
.pill{appearance:none;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:700;padding:9px 14px;cursor:pointer;white-space:nowrap}
.pill:active{background:rgba(255,255,255,.28)}
.conn{font-size:13px;font-weight:500;opacity:.9;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4);display:inline-block;margin-right:6px}
.dot.on{background:#2EE6A6}

/* settings */
.set{margin-top:18px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-family:var(--disp);font-size:28px;font-weight:900;min-width:64px;text-align:center}
.stepper .btn{width:50px;padding:0;font-size:22px}
.rng{width:100%;margin:12px 0 0;accent-color:var(--bg);height:28px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{appearance:none;flex:1;min-width:62px;min-height:46px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 6px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--bg);background:var(--bg);color:#fff}
.custom{display:flex;align-items:center;gap:10px;margin-top:10px}
.custom input{width:120px;min-height:48px;text-align:center;font-family:var(--disp);font-weight:700}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sum span{background:var(--soft);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.bigcode{font-family:var(--disp);font-weight:900;font-size:clamp(40px,13vw,56px);letter-spacing:.1em;line-height:1.1;color:var(--bg);margin:4px 0 12px}
.notice{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;margin-top:14px}

/* round */
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rhead h2{font-size:26px}
.timer{font-family:var(--disp);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--mut);margin-left:3px}
.timer.low{color:var(--pd)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--bg);width:0;border-radius:4px;transition:width .25s linear}
.bar.low i{background:var(--p)}
.prompt{color:var(--mut);font-size:14px;font-weight:500;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700}
.chip small{color:var(--mut);font-size:12px;font-weight:500;margin-right:5px}
.chip.m{color:#fff}.chip.m small{color:rgba(255,255,255,.85)}
.entry{margin-top:18px}
.entry input{font-size:22px;font-weight:700;min-height:60px}
.entry .btn{min-height:60px}
.sent{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#E3FBF2;border-radius:16px;padding:14px 16px;margin-top:18px}
.sent b{font-size:24px;font-weight:900;word-break:break-all;line-height:1.2}
.sent .mut{color:var(--ok);font-weight:700}
.prog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;font-weight:700;color:var(--mut)}
.prog .bar{flex:1;margin:0}.prog .bar i{background:#2EE6A6}

/* results */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:16px}
.glist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.wc{border-radius:18px;padding:12px 14px;background:var(--soft);animation:pop .4s cubic-bezier(.3,1.4,.5,1) both}
.wc .who{font-size:12px;font-weight:700;color:var(--mut);line-height:1.45}
.wc .w{font-size:24px;font-weight:900;word-break:break-all;line-height:1.25}
.wc.m{color:#fff}.wc.m .who{color:rgba(255,255,255,.88)}
.wc .w.none{font-size:15px;color:var(--mut);font-weight:700}
.wc.mine{outline:3px solid var(--ink);outline-offset:-3px}
.cnt{font-family:var(--disp);font-size:15px;font-weight:700;opacity:.8}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.winhero{text-align:center}
.winhero .venn{--gap:20%;width:min(92%,380px)}
.winhero .line{font-size:16px;font-weight:700;margin-top:12px}
.acts{display:grid;gap:12px;margin-top:20px}
.acts .btn{margin:0;width:100%}

/* players */
.players{list-style:none;padding:0;margin-top:10px}
.players li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--soft)}
.players li:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;flex:none}
.players .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tag2{font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;margin-left:6px;background:var(--soft);color:var(--mut)}
.tag2.h{background:var(--y);color:var(--ink)}
.st{font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.st.ok{color:var(--ok)}
.players.compact{display:flex;flex-wrap:wrap;gap:6px}
.players.compact li{border:2px solid var(--soft);border-radius:999px;padding:3px 11px 3px 3px;gap:6px;font-size:14px;font-weight:700}
.players.compact li:last-child{border-bottom:2px solid var(--soft)}
.players.compact li.done{border-color:#2EE6A6;color:var(--ok)}
.players.compact li.spec{opacity:.55}
.players.compact li.pend{border-color:var(--bg);color:var(--bg)}
.players.compact li.pick{cursor:pointer;opacity:1;border-style:dashed;border-color:var(--line)}
.players.compact .av{width:24px;height:24px;font-size:11px}
.hist .h{padding:10px 0;border-bottom:2px solid var(--soft)}
.hist .h:last-child{border-bottom:0;padding-bottom:0}
.hist .rn{font-size:13px;color:var(--mut);font-weight:700;margin-bottom:6px}

/* full-screen moments: countdown and the meet */
.fx{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:var(--bg2);transition:opacity .28s;padding:24px}
.fx.out{opacity:0;pointer-events:none}
.fx{overflow:hidden}
.fx .venn{width:min(72vw,56vh,520px)}
.fx p{color:#fff;font-size:clamp(18px,5vw,26px);font-weight:900;letter-spacing:.2em;min-height:1.6em;text-align:center}
.fx.cd .venn b{font-size:min(30vw,24vh,210px)}
.fx.cd.n3 .venn{--gap:56%}
.fx.cd.n2 .venn{--gap:37%}
.fx.cd.n1 .venn{--gap:18%}
.fx.cd.go .venn{--gap:0%}
.fx.cd.go .venn b{font-size:min(17vw,13vh,110px)}
.fx .venn b.pop{animation:num .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes num{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.fx.win{cursor:pointer}
.fx.win .venn{--gap:0%}
.fx.win .venn i{transition-duration:.75s;transition-timing-function:cubic-bezier(.5,0,.3,1.25)}
.fx.win.pre .venn{--gap:150%}
.fx.win .venn b{opacity:0;transform:scale(.3);font-size:min(22vw,calc(72vw / var(--n,2)),15vh,150px)}
.fx.win p{opacity:0}
.fx.win.hit{animation:flash .5s ease-out}
.fx.win.hit .venn{animation:thump .5s cubic-bezier(.3,1.6,.5,1)}
.fx.win.hit .venn b{opacity:1;transform:none;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.fx.win.hit p{opacity:1;transition:opacity .3s .2s}
@keyframes flash{0%{background:#fff}100%{background:var(--bg2)}}
@keyframes thump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* keepsake image */
.modal{position:fixed;inset:0;z-index:70;background:rgba(17,18,59,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:24px;padding:16px;width:min(100%,420px);max-height:100%;overflow:auto}
.modal img{display:block;width:100%;border-radius:14px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

@media (min-width:900px){
  .wrap{max-width:1060px;padding:28px 28px 80px}
  .home{grid-template-columns:1.05fr .95fr;grid-template-areas:"hero panel" "how panel";column-gap:56px;align-items:start;padding-top:8vh}
  .hero{text-align:left}
  .hero .venn{margin:0;width:260px}
  .hero h1{font-size:84px}
  .hero .tag{font-size:20px}
  .how{font-size:16px;margin-top:6px}
  .panel{align-self:center}
  .panel .card{padding:28px}
  .room{grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .room aside{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-bottom:12px}
  #stage .card{padding:28px}
  .rhead h2{font-size:32px}
  .entry input{font-size:26px;min-height:68px}
  .entry .btn{min-height:68px;padding:12px 30px}
  .wc .w{font-size:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .acts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .top .code b{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="fx" class="fx" hidden><div class="venn"><i class="c1"></i><i class="c2"></i><b id="fxt"></b></div><p id="fxs"></p></div>
<canvas id="confetti"></canvas>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
/* ---------- utils ---------- */
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPHA[b % ALPHA.length]).join('');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
const bytes = o => new TextEncoder().encode(JSON.stringify(o)).length;
function store(kind, k, v) { try { const st = kind === 's' ? sessionStorage : localStorage; if (v === undefined) return st.getItem(k); st.setItem(k, v); } catch (e) { return null; } }
const COLORS = ['#FF4F8B', '#3A3DF0', '#00A77A', '#F08A00', '#8A4DFF', '#0098C4', '#D63A3A', '#5B8C00', '#B0429E', '#7A5C00'];
const colorOf = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- state ---------- */
const S = {
  id: store('s', 'tc_id') || (() => { const i = rid(6); store('s', 'tc_id', i); return i; })(),
  name: store('l', 'tc_name') || '',
  view: 'home', code: null, tr: null, mode: null, conn: false,
  peers: [], j: null, isHost: false, hg: null, g: null,
  word: '', draft: '', subKey: null, wOut: null,
  hist: {}, seenAt: {}, ht: {}, err: '', stageKey: '', histKey: '',
  cap: 8, secs: 60, wr: 'all', connecting: false, created: false, customSecs: false, cfm: 0
};
const MAXCAP = (window.claude && typeof window.claude.use === 'function') ? 10 : 100;
const CD_MS = 3000; // 3-2-1 before the first round
const RES_MS = 10000; // how long the round result stays up before the next round
const BIG = 12; // above this many players, show words grouped instead of one card per person
const byJ = (a, b) => (a.j - b.j) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const active = () => S.peers.filter(p => p.j).sort(byJ);

/* ---------- transports (all expose: set(obj), leave()) ---------- */
async function roomTransport(api, code) {
  let r = null;
  try { r = await api.join('tongci-' + code); } catch (e) { r = null; }
  const t = r || api, lobby = !r;
  const subs = [];
  subs.push(t.onPeers(ch => {
    onPeers(ch.peers.filter(p => p.presence && p.presence.id && (!lobby || p.presence.k === code))
      .map(p => Object.assign({}, p.presence, { me: p.sameTab })));
  }, e => fatal(e && e.code)));
  if (t.onConnection) subs.push(t.onConnection(c => { S.conn = c; renderTop(); }, () => {}));
  return {
    set(o) { return t.presence(o).catch(() => {}); },
    leave() {
      subs.forEach(u => { try { u(); } catch (e) {} });
      if (r) r.leave().catch(() => {});
      else api.presence({ id: null, n: null, j: null, k: null, d: null, w: null, g: null }).catch(() => {});
    }
  };
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
}

async function mqttTransport(code) {
  if (!window.mqtt) await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js');
  // v2: small per-player presence on p/<id>; host game state on its own retained topic g, sent only when it changes
  const base = 'tongci-v3/' + code + '/p/', gTopic = 'tongci-v3/' + code + '/g', mine = base + S.id;
  const c = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
    clientId: 'tc_' + S.id + '_' + rid(4), clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000,
    will: { topic: mine, payload: '', retain: true, qos: 0 }
  });
  const map = new Map(); let me = null, gMsg = null, lastG = '', closed = false, pt = null, gt = null;
  const emit = () => onPeers([...map.values()].map(v => {
    const o = Object.assign({}, v.p, { me: v.p.id === S.id });
    if (gMsg && gMsg.from === o.id) o.g = gMsg.g;
    return o;
  }));
  const pubP = () => { if (c.connected && me) c.publish(mine, JSON.stringify(me), { retain: true, qos: 0 }); };
  const pubG = () => { if (c.connected && lastG) c.publish(gTopic, lastG, { retain: true, qos: 0 }); };
  c.on('message', (topic, buf) => {
    const s = buf.toString();
    if (topic === gTopic) {
      if (!s) return;

  });

  c.on('offline', () => { S.conn = false; renderTop(); });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), 10000);
    c.on('connect', () => { S.conn = true; renderTop(); c.subscribe([base + '+', gTopic], { qos: 0 }, () => { clearTimeout(to); pubP(); pubG(); res(); }); });
  });
  const hb = setInterval(() => {
    pubP(); const now = Date.now(); let ch = false;
    for (const [id, v] of map) if (id !== S.id && now - v.seen > 32000) { map.delete(id); ch = true; }
    if (ch) emit();

// local test mode (?local): an in-browser stand-in for the MQTT broker over BroadcastChannel, so several tabs can play offline
function fakeMqtt() {
  const match = (f, t) => { const a = f.split('/'), b = t.split('/'); return a.length === b.length && a.every((x, i) => x === '+' || x === b[i]); };
  return { connect() {
    const ch = new BroadcastChannel('tongci-fake-broker'), hs = {}, subs = [], own = new Map(); // each tab re-serves only its own retained topics
    const fire = (ev, ...a) => (hs[ev] || []).forEach(f => f(...a));
    const deliver = m => { if (subs.some(f => match(f, m.topic))) fire('message', m.topic, m.payload); };
    ch.onmessage = e => { const m = e.data; if (m.t === 'pub') deliver(m); else if (m.t === 'getret') own.forEach((v, k) => ch.postMessage({ t: 'pub', topic: k, payload: v, retain: true })); };
    const cli = { connected: false,
      on(ev, f) { (hs[ev] = hs[ev] || []).push(f); return cli; },
      subscribe(t, o, cb) { subs.push(...[].concat(t)); ch.postMessage({ t: 'getret' }); if (cb) cb(); },
      publish(topic, payload, o) { const m = { t: 'pub', topic, payload: String(payload), retain: !!(o && o.retain) }; if (m.retain) { if (m.payload) own.set(topic, m.payload); else own.delete(topic); } ch.postMessage(m); deliver(m); },
      end() { ch.close(); } };
    setTimeout(() => { cli.connected = true; fire('connect'); }, 30);
    return cli;
  } };
}

/* ---------- presence push (coalesced) ---------- */

/* ---------- game state (host-authoritative, lives in host presence) ---------- */
function newG(cap, secs, wr) { return { v: 3, cap, secs, wr: wr || 'all', ph: 'lobby', seats: [], pend: [], nm: {}, gid: 0, r: 0, k: '', hist: [] }; }

function fitG(g) {

  Object.keys(g.nm).forEach(id => { if (!keep.has(id)) delete g.nm[id]; });
  while (S.mode === 'room' && bytes(g) > 3100 && g.hist.length > 1) {
    g.hist.shift();
    const k2 = new Set(g.seats); g.hist.forEach(h => Object.keys(h.w).forEach(id => k2.add(id)));

}

function hostTick() {
  const g = S.hg; if (!g || !S.isHost) return;
  const act = active(), ids = act.map(p => p.id), by = Object.fromEntries(act.map(p => [p.id, p]));
  const now = Date.now(), t = S.ht; let ch = false;
  if (g.ph === 'lobby') {
    const seats = ids.slice(0, g.cap);
    if (seats.join() !== g.seats.join()) { g.seats = seats; ch = true; }
  } else {
    const seats = g.seats.filter(id => by[id]);
    if (seats.length !== g.seats.length) { g.seats = seats; ch = true; }
    if (g.seats.length < 2) { g.ph = 'lobby'; g.seats = ids.slice(0, g.cap); ch = true; }
  }
  g.pend = g.pend || [];
  const pend = g.pend.filter(id => by[id] && !g.seats.includes(id));
  if (pend.length !== g.pend.length) { g.pend = pend; ch = true; }
  for (const id of g.seats.concat(g.pend)) { const n = by[id] && by[id].n; if (n && g.nm[id] !== n) { g.nm[id] = n; ch = true; } }

    if (t.k !== 'cd' + g.k) { t.k = 'cd' + g.k; t.cd = now; }
    if (now - t.cd >= CD_MS) { g.ph = 'in'; S.ht = {}; ch = true; }
  } else if (g.ph === 'in') {
    if (t.k !== g.k) { t.k = g.k; t.dl = g.secs ? now + g.secs * 1000 + 900 : 0; }
    const all = g.seats.every(id => by[id] && by[id].d === g.k);
    if (all || (t.dl && now > t.dl)) { g.ph = 'rv'; t.rv = now; ch = true; }
  } else if (g.ph === 'rv') {
    if (t.k !== g.k || !t.rv) { t.k = g.k; t.rv = now; }
    const subs = g.seats.filter(id => by[id] && by[id].d === g.k);
    const allW = subs.every(id => by[id].w && by[id].w.k === g.k);
    const waitDrafts = now - t.rv > 1500; // give auto-submitted drafts a moment
    if ((allW && waitDrafts) || now - t.rv > (g.seats.length > 30 ? 6000 : 4000)) {
      const w = {};
      for (const id of g.seats) { const p = by[id]; w[id] = (p && p.w && p.w.k === g.k) ? String(p.w.t || '').slice(0, 16) : ''; }
      const cnt = {}; g.seats.forEach(id => { const v = norm(w[id]); if (v) cnt[v] = (cnt[v] || 0) + 1; });
      const top = Math.max(0, ...Object.values(cnt)), n = g.seats.length;

}

function groupColors(entry) {

function entryFor(gid, r) { return S.hist[gid + '.' + r] || ((S.g && S.g.hist) || []).find(h => h.g === gid && h.r === r); }
const secsLabel = s => s ? `每輪 ${s} 秒` : '不限時';

function renderHist() {
  const el = document.getElementById('hist'); const g = S.g; if (!el) return;

  const list = Object.values(S.hist).filter(h => h.g === g.gid).sort((a, b) => b.r - a.r);
  const key = g.gid + ':' + list.map(h => h.r + (h.win ? (h.hd ? 'd' : 'w') : '')).join(',');
  if (key === S.histKey) return; S.histKey = key;
  el.innerHTML = list.length ? `<div class="card hist"><h2>每一輪寫了什麼</h2>${list.map(h => `<div class="h"><div class="rn">第 ${h.r} 輪${h.win ? (h.hd ? '，房主判定通關' : '，相遇') : ''}</div>${wordChips(h, groupColors(h).colors)}</div>`).join('')}</div>` : '';

function tickUI() {
  const g = S.g; if (!g || S.view !== 'room') return;
  if (g.ph === 'cd') updateFx();
  if (g.ph === 'in') {
    const t = document.getElementById('timer');
    if (g.secs) {
      const start = S.seenAt[g.k] || Date.now(), left = Math.max(0, g.secs * 1000 - (Date.now() - start)), low = left < 10000;
      if (t) { t.innerHTML = Math.ceil(left / 1000) + '<small>秒</small>'; t.classList.toggle('low', low); }
      const b = document.getElementById('tbar'); if (b) b.style.width = (100 * left / (g.secs * 1000)) + '%';
      const bw = document.getElementById('tbarw'); if (bw) bw.classList.toggle('low', low);
    } else if (t) t.innerHTML = '<small>不限時</small>';
  }
  if (g.ph === 'res') {
    if (!S.seenAt['res' + g.k]) S.seenAt['res' + g.k] = Date.now();
    const el = Date.now() - S.seenAt['res' + g.k];
    const b = document.getElementById('nbar'); if (b) b.style.width = Math.min(100, 100 * el / RES_MS) + '%';
    const t = document.getElementById('ntimer'); if (t) t.innerHTML = Math.max(0, Math.ceil((RES_MS - el) / 1000)) + '<small>秒後下一輪</small>';
  }
}
setInterval(() => { if (S.isHost) hostTick(); tickUI(); }, 250);

/* ---------- full-screen moments: 3-2-1 and the meet ---------- */
const fx = { el: document.getElementById('fx'), t: document.getElementById('fxt'), s: document.getElementById('fxs'), mode: null, n: 0, wonKey: null, timer: null };
function fxHide() {
  if (fx.el.hidden) { fx.mode = null; return; }
  fx.mode = null; fx.el.classList.add('out');
  setTimeout(() => { if (!fx.mode) { fx.el.hidden = true; fx.el.className = 'fx'; } }, 300);
}
function updateFx() {
  const g = S.g, ph = S.view === 'room' && g ? g.ph : null;
  if (ph === 'cd') {
    const el = Date.now() - (S.seenAt['cd' + g.k] || Date.now());
    const n = Math.max(1, Math.min(3, 3 - Math.floor(el / 1000)));
    if (fx.mode !== 'cd' || fx.n !== n) {
      fx.mode = 'cd'; fx.n = n; fx.el.hidden = false; fx.el.className = 'fx cd n' + n;
      fx.t.textContent = n; fx.t.style.removeProperty('--n'); fx.s.textContent = '準備';
      fx.t.classList.remove('pop'); void fx.t.offsetWidth; fx.t.classList.add('pop');
    }
  } else if (fx.mode === 'cd') {
    if (ph === 'in') {
      fx.mode = 'go'; fx.el.className = 'fx cd go'; fx.t.textContent = '開始'; fx.s.textContent = '';
      fx.t.classList.remove('pop'); void fx.t.offsetWidth; fx.t.classList.add('pop');
      clearTimeout(fx.timer); fx.timer = setTimeout(() => { if (fx.mode === 'go') fxHide(); }, 650);
    } else fxHide();
  }
  if (ph === 'win') {
    if (fx.wonKey !== S.code + g.k) { const e = entryFor(g.gid, g.r); if (e) { fx.wonKey = S.code + g.k; playWin(e, g); } }
  } else if (fx.mode === 'win') fxHide();
  if (!ph && fx.mode) fxHide();
}
function playWin(e, g) {
  const word = winWord(e);
  fx.mode = 'win'; fx.el.hidden = false; fx.el.className = 'fx win pre';
  fx.t.classList.remove('pop'); fx.t.textContent = word; fx.t.style.setProperty('--n', Math.max(2, vlen(word)).toFixed(1));
  fx.s.textContent = e.hd ? '全員通關' : `第 ${g.r} 輪，相遇`;
  void fx.el.offsetWidth; fx.el.classList.remove('pre');
  clearTimeout(fx.timer);
  setTimeout(() => { if (fx.mode === 'win') { fx.el.classList.add('hit'); confetti(); } }, reduced() ? 0 : 720);
  fx.timer = setTimeout(() => { if (fx.mode === 'win') fxHide(); }, 3400);
}
fx.el.addEventListener('click', () => { if (fx.mode === 'win') fxHide(); });

let confRaf = 0;
function confetti() {
  if (reduced()) return;
  const c = document.getElementById('confetti'), ctx = c.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FF4F8B', '#FFD43B', '#FFFFFF', '#2EE6A6', '#FF4220'], parts = [], sp = Math.max(9, Math.min(22, H / 42));
  const add = (x, y, ang, v, delay) => parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, w: 6 + Math.random() * 8, h: 4 + Math.random() * 8, r: Math.random() * 6.3, vr: (Math.random() - .5) * .4, c: cols[parts.length % cols.length], round: Math.random() < .3, delay });
  const r0 = Math.min(W, H) * .33;
  for (let i = 0; i < 90; i++) { const a = Math.random() * Math.PI * 2; add(W * .5 + Math.cos(a) * r0, H * .47 + Math.sin(a) * r0, a, sp * (.35 + Math.random() * .8), 0); }
  for (let i = 0; i < 70; i++) { add(-10, H * .8, -Math.PI / 2 + .25 + Math.random() * .7, sp * (.8 + Math.random() * .7), 12); add(W + 10, H * .8, -Math.PI / 2 - .25 - Math.random() * .7, sp * (.8 + Math.random() * .7), 12); }
  for (let i = 0; i < 80; i++) { add(Math.random() * W, -20 - Math.random() * H * .5, Math.PI / 2 + (Math.random() - .5) * .4, 2 + Math.random() * 3, 50 + Math.random() * 60); }
  let f = 0; cancelAnimationFrame(confRaf);
  const step = () => {
    f++; ctx.clearRect(0, 0, W, H); let alive = 0;
    for (const p of parts) {
      if (f < p.delay) { alive++; continue; }
      p.vy += .32; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 30) continue; alive++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.3); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1);
      ctx.restore();
    }
    if (alive && f < 520) confRaf = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  };
  confRaf = requestAnimationFrame(step);
}

/* ---------- keepsake image ---------- */
const card = { url: null, blob: null };
function fitText(ctx, text, weight, family, max, maxW) { let s = max; do { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(text).width <= maxW) break; s -= 4; } while (s > 28); return s; }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function clip1(ctx, text, maxW) { if (ctx.measureText(text).width <= maxW) return text; let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; }
async function drawCard() {
  const g = S.g, e = entryFor(g.gid, g.r); if (!e) return null;
  const FB = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif', FD = '"Unbounded",' + FB;
  const word = winWord(e), n = Object.keys(e.w).length, gc = groupColors(e);
  const rounds = Object.values(S.hist).filter(h => h.g === g.gid).sort((a, b) => a.r - b.r);
  try { await Promise.race([Promise.all([document.fonts.load('900 80px "Noto Sans TC"', '同詞相遇' + word), document.fonts.load('700 40px "Noto Sans TC"', '第輪個人在相遇了')]), sleep(1500)]); } catch (x) {}
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  ctx.fillStyle = '#2A2DE0'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .18; ctx.fillStyle = '#FF4F8B'; ctx.beginPath(); ctx.arc(-60, -40, 420, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#FFD43B'; ctx.beginPath(); ctx.arc(W + 80, H + 40, 440, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1;
  // header
  ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = `900 46px ${FB}`; ctx.fillText('同詞相遇', 72, 108);
  const d = new Date(), date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  ctx.textAlign = 'right'; ctx.font = `700 30px ${FD}`; ctx.globalAlpha = .85; ctx.fillText(date, W - 72, 106); ctx.globalAlpha = 1;
  // measure the block, then centre it between header and footer
  const show = rounds.slice(-5), cut = rounds.length - show.length, rowH = 62, px = 72, pw = W - 144, ph2 = 56 + show.length * rowH + (cut ? 40 : 0);
  const names = Object.keys(e.w).map(id => (e.nm && e.nm[id]) || nameOf(id)), maxW = W - 160;
  ctx.font = `700 32px ${FB}`; let lineTxt = '', lines = [];
  for (const nm of names) { const t = lineTxt ? lineTxt + '、' + nm : nm; if (ctx.measureText(t).width > maxW && lineTxt) { lines.push(lineTxt); lineTxt = nm; } else lineTxt = t; }
  if (lineTxt) lines.push(lineTxt);
  const R = 220, top = 160, fixedH = 2 * R + 95 + 45 + ph2 + 60, roomL = Math.max(1, Math.floor((H - 96 - top - fixedH) / 46) + 1);
  if (lines.length > roomL) { lines = lines.slice(0, roomL); lines[roomL - 1] = clip1(ctx, lines[roomL - 1], maxW - 200) + ` 等 ${names.length} 人`; }
  const blockH = fixedH + (lines.length - 1) * 46 + 12, oy = top + Math.max(0, (H - 96 - top - blockH) / 2);
  // venn
  const cy = oy + R, off = 112, cx = W / 2;
  ctx.fillStyle = '#FF4F8B'; ctx.beginPath(); ctx.arc(cx - off, cy, R, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#FFD43B'; ctx.beginPath(); ctx.arc(cx + off, cy, R, 0, 6.3); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx - off, cy, R, 0, 6.3); ctx.clip(); ctx.fillStyle = '#FF4220'; ctx.beginPath(); ctx.arc(cx + off, cy, R, 0, 6.3); ctx.fill(); ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fs = fitText(ctx, word, 900, FD, 180, 620);
  ctx.fillStyle = '#11123B'; ctx.fillText(word, cx, cy + fs * .07 + 4); ctx.fillStyle = '#fff'; ctx.fillText(word, cx, cy + 4);
  // headline
  ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.font = `900 54px ${FB}`;
  ctx.fillText(e.hd ? `${n} 個人在第 ${g.r} 輪全員通關` : `${gc.max === n ? n + ' 個人' : gc.max + ' / ' + n + ' 人'}在第 ${g.r} 輪相遇了`, cx, oy + 2 * R + 95);
  // the road here
  const py = oy + 2 * R + 95 + 45;
  ctx.fillStyle = '#fff'; rr(ctx, px, py, pw, ph2, 36); ctx.fill();
  let y = py + 74; ctx.textAlign = 'left';
  if (cut) { ctx.fillStyle = '#5D6092'; ctx.font = `500 28px ${FB}`; ctx.fillText(`前 ${cut} 輪省略`, px + 40, y - 14); y += 40; }
  for (const h of show) {
    const last = h.r === g.r;
    ctx.fillStyle = last ? '#D62E69' : '#5D6092'; ctx.font = `700 30px ${FB}`; ctx.fillText(`第 ${h.r} 輪`, px + 40, y);
    const gl = groups(h).list, txt = gl.map(x => x.word + (x.ids.length > 1 ? ' ×' + x.ids.length : '')).join('　');
    ctx.fillStyle = last ? '#D62E69' : '#11123B'; ctx.font = `${last ? 900 : 700} 34px ${FB}`; ctx.fillText(clip1(ctx, txt || '（沒有人寫）', pw - 230), px + 190, y);
    y += rowH;
  }
  // who was there
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = `700 32px ${FB}`;
  let ny = py + ph2 + 60;

  ctx.globalAlpha = .8; ctx.font = `500 26px ${FB}`; ctx.fillText(S.mode === 'mqtt' && location.host ? location.host + location.pathname.replace(/index\.html$/, '') : '同詞相遇・連線版', cx, H - 48); ctx.globalAlpha = 1;
  return c;
}
async function openCard() {
  const m = document.getElementById('modal');
  let c; try { c = await drawCard(); } catch (x) { c = null; }
  if (!c) { toast('圖片產生失敗，再試一次'); return; }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if (card.url) URL.revokeObjectURL(card.url);
  card.blob = blob; card.url = blob ? URL.createObjectURL(blob) : c.toDataURL('image/png');
  const file = blob && typeof File === 'function' ? new File([blob], 'tongci.png', { type: 'image/png' }) : null;
  let canShare = false; try { canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); } catch (x) {}
  card.file = file;
  const canDl = S.mode !== 'room';
  m.innerHTML = `<div class="box" role="dialog" aria-label="紀念圖"><img src="${card.url}" alt="這一場的紀念圖">
    <div class="acts" style="margin-top:14px">${canDl ? `<a class="btn primary center" style="text-decoration:none;display:grid;place-items:center" href="${card.url}" download="${esc('同詞相遇-' + (winWord(entryFor(S.g.gid, S.g.r)) || '紀念').replace(/[\\/:*?"<>|／…]/g, '-'))}.png">下載圖片</a>` : ''}${canShare ? `<button class="btn pink" data-a="share">分享</button>` : ''}<button class="btn" data-a="mclose">關閉</button></div>
    <p class="mut center" style="margin-top:10px">${canDl ? '手機也可以長按圖片儲存' : '長按或右鍵點圖片就能儲存'}</p></div>`;
  m.hidden = false;
}
function closeCard() { document.getElementById('modal').hidden = true; }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeCard(); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'create') enter(rid(4), true);
  else if (a === 'join') { const c = (document.getElementById('code').value || '').trim().toLowerCase(); enter(c, false); }
  else if (a === 'clearhash') { try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {} const c = document.getElementById('code'); if (c) c.value = ''; render(); }
  else if (a === 'leave') leave();
  else if (a === 'copy') copyCode();
  else if (a === 'hcap-' || a === 'hcap+') setOpt('cap', Math.max(2, Math.min(MAXCAP, S.hg.cap + (a === 'hcap+' ? 1 : -1))));
  else if (a === 'hsecs') { S.customSecs = false; setOpt('secs', +b.dataset.v); render(); }
  else if (a === 'hcustom') { S.customSecs = true; if (S.hg && !S.hg.secs) setOpt('secs', 45); render(); const i = document.getElementById('csecs'); if (i) { i.focus(); i.select(); } }
  else if (a === 'hwr') setOpt('wr', b.dataset.v);
  else if (a === 'start' || a === 'again') startGame();
  else if (a === 'lobby') toLobby();
  else if (a === 'next') nextRound();
  else if (a === 'pend') togglePend(b.dataset.id);
  else if (a === 'declare') declareWin();
  else if (a === 'declare-prev') { if (Date.now() - S.cfm < 4000) { S.cfm = 0; declareWin(); } else { S.cfm = Date.now(); b.textContent = '再按一次，確定宣布上一輪全員通關'; } }
  else if (a === 'submit') submitWord();
  else if (a === 'unsub') unsubmit();
  else if (a === 'card') openCard();
  else if (a === 'mclose') closeCard();
  else if (a === 'share') { if (card.file && navigator.share) navigator.share({ files: [card.file], title: '同詞相遇' }).catch(() => {}); }
});
function applyCustomSecs(el) { const v = Math.max(5, Math.min(600, Math.round(+el.value || 0))); el.value = v; setOpt('secs', v); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCard(); if (fx.mode === 'win') fxHide(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target; if (!t) return;
  if (t.id === 'csecs') { e.preventDefault(); t.blur(); }
  else if (t.dataset && t.dataset.a === 'pend' && t.tagName === 'LI') togglePend(t.dataset.id);
  else if (S.view === 'home' && (t.id === 'code' || t.id === 'name')) { e.preventDefault(); const j = document.querySelector('[data-a="join"]'), c = document.querySelector('[data-a="create"]'); const code = document.getElementById('code'); if (j && code && code.value.trim()) j.click(); else if (c) c.click(); else if (j) j.click(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'hcapr') { const b = e.target.parentNode.querySelector('.stepper b'); if (b) b.textContent = e.target.value; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'hcapr') setOpt('cap', +e.target.value);
  else if (e.target.id === 'csecs') applyCustomSecs(e.target);
});
window.addEventListener('hashchange', () => { if (S.view === 'home') render(); });
render();
</script>
