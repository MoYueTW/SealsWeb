<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同詞相遇・連線版</title>
<style>
:root{--bg:#f4eee3;--ink:#211c17;--mut:#7d7265;--card:#fffaf1;--line:#e4d9c6;--a:#ff5a3c;--b:#23807a;--y:#ffc94a;--ok:#2f9e5b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:2px}
h2{font-size:17px;margin:0 0 10px}
p{margin:0}
.hero{text-align:center;padding:10px 0 14px}
.hero p{color:var(--mut);font-size:14px}
.logo{display:flex;justify-content:center;margin:4px 0}
.logo span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.logo .l1{background:var(--a)}.logo .l2{background:var(--b);margin-left:-12px;mix-blend-mode:multiply}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 6px}
label:first-child{margin-top:0}
input[type=text]{width:100%;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--ink)}
.row{display:flex;gap:8px}.row>input{flex:1;min-width:0}
.btn{appearance:none;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#fff}
.btn.accent{background:var(--a);border-color:var(--a);color:#fff}
.btn.block{width:100%;margin-top:14px}
.btn.small{font-size:14px;padding:7px 12px;border-radius:10px}
.btn.ghost{border-color:var(--line);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-size:26px;min-width:44px;text-align:center}
.rng{width:100%;margin:10px 0 2px;accent-color:var(--ink)}
.stepper .btn{width:46px;padding:8px 0;font-size:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;font-size:15px;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.err{color:#c0392b;font-size:14px;margin:8px 2px;white-space:pre-line}
.mut{color:var(--mut);font-size:14px}
details.rules{margin-top:16px;color:var(--mut);font-size:14px}
details.rules summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.rules ol{padding-left:20px;margin:8px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top .code{font-size:13px;color:var(--mut)}
.top .code b{display:block;font-size:24px;letter-spacing:4px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.1}
.top .sp{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block;margin-right:5px;vertical-align:1px}
.dot.on{background:var(--ok)}
.round{display:flex;align-items:baseline;justify-content:space-between}
.round h2{font-size:22px;margin:0}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px}
.timer.low{color:var(--a)}
.prompt{color:var(--mut);font-size:14px;margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:15px}
.chip small{color:var(--mut);font-size:12px;margin-right:4px}
.chip.m{border-color:transparent;color:#fff}
.sent{display:flex;align-items:center;justify-content:space-between;background:#eef7f0;border:1px solid #cfe7d6;border-radius:12px;padding:12px 14px}
.sent b{font-size:20px}
.players{list-style:none;margin:0;padding:0}
.players li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.players li:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.players .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;margin-left:4px;background:#efe6d6;color:var(--mut)}
.tag.h{background:var(--y);color:#5a4300}
.st{font-size:13px;color:var(--mut)}
.st.ok{color:var(--ok);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.wc{border-radius:14px;padding:10px 12px;background:#fff;border:1px solid var(--line);animation:pop .35s ease both}
.wc .who{font-size:12px;color:var(--mut)}
.wc .w{font-size:22px;font-weight:800;word-break:break-all}
.wc.m{color:#fff;border-color:transparent}.wc.m .who{color:rgba(255,255,255,.85)}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wc.gw .who{margin-top:2px;line-height:1.45}
.wc.mine{outline:2.5px solid var(--ink);outline-offset:-2px}
.cnt{font-size:15px;font-weight:700;opacity:.75}
.players.compact{display:flex;flex-wrap:wrap;gap:6px}
.players.compact li{border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;gap:6px;font-size:14px;background:#fff}
.players.compact li:last-child{border-bottom:1px solid var(--line)}
.players.compact li.done{border-color:var(--ok);color:var(--ok);font-weight:700}
.players.compact li.spec{opacity:.55}
.players.compact li.pend{border-color:var(--b);color:var(--b);font-weight:700}
.players.compact li.pick{cursor:pointer;opacity:1;border-style:dashed}
.players.compact .av{width:22px;height:22px;font-size:11px}
.wc .w.none{font-size:15px;color:var(--mut);font-weight:600}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.win{text-align:center;padding:8px 0 4px}
.win .big{font-size:40px;font-weight:900;letter-spacing:2px;color:var(--a);margin:4px 0;word-break:break-all}
.win .em{font-size:44px;animation:pop .5s ease both}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s linear}
.hist .h{padding:8px 0;border-bottom:1px dashed var(--line)}
.hist .h:last-child{border-bottom:0}
.hist .rn{font-size:13px;color:var(--mut);font-weight:700}
.hist .chips{margin:4px 0 0}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";
/* ---------- utils ---------- */
const ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789';
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPHA[b % ALPHA.length]).join('');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
const bytes = o => new TextEncoder().encode(JSON.stringify(o)).length;
function store(kind, k, v) { try { const st = kind === 's' ? sessionStorage : localStorage; if (v === undefined) return st.getItem(k); st.setItem(k, v); } catch (e) { return null; } }
const COLORS = ['#ff5a3c', '#23807a', '#7b5cd6', '#e0962b', '#2f7fd1', '#d94f8c', '#4c9a2a', '#a0522d', '#0f9aa8', '#8a6d00'];
const colorOf = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- state ---------- */
const S = {
  id: store('s', 'tc_id') || (() => { const i = rid(6); store('s', 'tc_id', i); return i; })(),
  name: store('l', 'tc_name') || '',
  view: 'home', code: null, tr: null, mode: null, conn: false,
  peers: [], j: null, isHost: false, hg: null, g: null,
  word: '', draft: '', subKey: null, wOut: null,
  hist: {}, seenAt: {}, ht: {}, err: '', stageKey: '', histKey: '',
  cap: 8, secs: 60, wr: 'all', connecting: false, created: false
};
const MAXCAP = (window.claude && typeof window.claude.use === 'function') ? 10 : 100;
const RES_MS = 8000; // how long the round result stays up before the next round
const BIG = 12; // above this many players, show words grouped instead of one card per person
const byJ = (a, b) => (a.j - b.j) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
const active = () => S.peers.filter(p => p.j).sort(byJ);

/* ---------- transports (all expose: set(obj), leave()) ---------- */
async function roomTransport(api, code) {
  let r = null;
  try { r = await api.join('tongci-' + code); } catch (e) { r = null; }
  const t = r || api, lobby = !r;
  const subs = [];
  subs.push(t.onPeers(ch => {
    onPeers(ch.peers.filter(p => p.presence && p.presence.id && (!lobby || p.presence.k === code))
      .map(p => Object.assign({}, p.presence, { me: p.sameTab })));
  }, e => fatal(e && e.code)));
  if (t.onConnection) subs.push(t.onConnection(c => { S.conn = c; renderTop(); }, () => {}));
  return {
    set(o) { return t.presence(o).catch(() => {}); },
    leave() {
      subs.forEach(u => { try { u(); } catch (e) {} });
      if (r) r.leave().catch(() => {});
      else api.presence({ id: null, n: null, j: null, k: null, d: null, w: null, g: null }).catch(() => {});
    }
  };
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
}

async function mqttTransport(code) {
  if (!window.mqtt) await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js');
  // v2: small per-player presence on p/<id>; host game state on its own retained topic g, sent only when it changes
  const base = 'tongci-v2/' + code + '/p/', gTopic = 'tongci-v2/' + code + '/g', mine = base + S.id;
  const c = window.mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
    clientId: 'tc_' + S.id + '_' + rid(4), clean: true, keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000,
    will: { topic: mine, payload: '', retain: true, qos: 0 }
  });
  const map = new Map(); let me = null, gMsg = null, lastG = '', closed = false, pt = null, gt = null;
  const emit = () => onPeers([...map.values()].map(v => {
    const o = Object.assign({}, v.p, { me: v.p.id === S.id });
    if (gMsg && gMsg.from === o.id) o.g = gMsg.g;
    return o;
  }));
  const pubP = () => { if (c.connected && me) c.publish(mine, JSON.stringify(me), { retain: true, qos: 0 }); };
  const pubG = () => { if (c.connected && lastG) c.publish(gTopic, lastG, { retain: true, qos: 0 }); };
  c.on('message', (topic, buf) => {
    const s = buf.toString();
    if (topic === gTopic) {
      if (!s) return;
      try { const m = JSON.parse(s); if (m && m.from && m.g && m.from !== S.id) { gMsg = m; emit(); } } catch (e) {}
      return;
    }
    const id = topic.slice(base.length); if (id === S.id) return;
    if (!s) { if (map.delete(id)) emit(); return; }
    try { const p = JSON.parse(s); if (p && p.id === id) { map.set(id, { p, seen: Date.now() }); emit(); } } catch (e) {}
  });
  c.on('close', () => { S.conn = false; renderTop(); });
  c.on('offline', () => { S.conn = false; renderTop(); });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('timeout')), 10000);
    c.on('connect', () => { S.conn = true; renderTop(); c.subscribe([base + '+', gTopic], { qos: 0 }, () => { clearTimeout(to); pubP(); pubG(); res(); }); });
  });
  const hb = setInterval(() => {
    pubP(); const now = Date.now(); let ch = false;
    for (const [id, v] of map) if (id !== S.id && now - v.seen > 32000) { map.delete(id); ch = true; }
    if (ch) emit();
  }, 10000);
  const bye = () => { if (closed) return; closed = true; clearInterval(hb); try { c.publish(mine, '', { retain: true }); } catch (e) {} setTimeout(() => { try { c.end(true); } catch (e) {} }, 300); };
  window.addEventListener('pagehide', bye);
  return {
    set(o) {
      const g = o.g; const p = Object.assign({}, o); delete p.g; p.hb = Date.now();
      if (!me || JSON.stringify(Object.assign({}, me, { hb: 0 })) !== JSON.stringify(Object.assign({}, p, { hb: 0 }))) { clearTimeout(pt); pt = setTimeout(pubP, 40); }
      me = p; map.set(S.id, { p, seen: Date.now() });
      if (g) {
        const str = JSON.stringify({ from: S.id, g });
        if (str !== lastG) { lastG = str; gMsg = { from: S.id, g }; clearTimeout(gt); gt = setTimeout(pubG, 200); }
      } else lastG = '';
      emit();
    },
    leave: bye
  };
}

// local test mode (?local): an in-browser stand-in for the MQTT broker over BroadcastChannel, so several tabs can play offline
function fakeMqtt() {
  const match = (f, t) => { const a = f.split('/'), b = t.split('/'); return a.length === b.length && a.every((x, i) => x === '+' || x === b[i]); };
  return { connect() {
    const ch = new BroadcastChannel('tongci-fake-broker'), hs = {}, subs = [], own = new Map(); // each tab re-serves only its own retained topics
    const fire = (ev, ...a) => (hs[ev] || []).forEach(f => f(...a));
    const deliver = m => { if (subs.some(f => match(f, m.topic))) fire('message', m.topic, m.payload); };
    ch.onmessage = e => { const m = e.data; if (m.t === 'pub') deliver(m); else if (m.t === 'getret') own.forEach((v, k) => ch.postMessage({ t: 'pub', topic: k, payload: v, retain: true })); };
    const cli = { connected: false,
      on(ev, f) { (hs[ev] = hs[ev] || []).push(f); return cli; },
      subscribe(t, o, cb) { subs.push(...[].concat(t)); ch.postMessage({ t: 'getret' }); if (cb) cb(); },
      publish(topic, payload, o) { const m = { t: 'pub', topic, payload: String(payload), retain: !!(o && o.retain) }; if (m.retain) { if (m.payload) own.set(topic, m.payload); else own.delete(topic); } ch.postMessage(m); deliver(m); },
      end() { ch.close(); } };
    setTimeout(() => { cli.connected = true; fire('connect'); }, 30);
    return cli;
  } };
}

/* ---------- presence push (coalesced) ---------- */
let pushT = null;
function pushMe() {
  clearTimeout(pushT);
  pushT = setTimeout(() => {
    if (!S.tr) return;
    S.tr.set({ id: S.id, n: S.name, j: S.j || null, k: S.code, d: S.subKey || null, w: S.wOut || null, g: S.isHost ? S.hg : null });
  }, 30);
}

/* ---------- game state (host-authoritative, lives in host presence) ---------- */
function newG(cap, secs, wr) { return { v: 2, cap, secs, wr: wr || 'all', ph: 'lobby', seats: [], pend: [], nm: {}, gid: 0, r: 0, k: '', hist: [] }; }

function fitG(g) {
  if (g.hist.length > 2) g.hist = g.hist.slice(-2); // players keep the full history locally; the wire only carries the last rounds
  const keep = new Set(g.seats.concat(g.pend || [])); g.hist.forEach(h => Object.keys(h.w).forEach(id => keep.add(id)));
  Object.keys(g.nm).forEach(id => { if (!keep.has(id)) delete g.nm[id]; });
  while (S.mode === 'room' && bytes(g) > 3100 && g.hist.length > 1) {
    g.hist.shift();
    const k2 = new Set(g.seats); g.hist.forEach(h => Object.keys(h.w).forEach(id => k2.add(id)));
    Object.keys(g.nm).forEach(id => { if (!k2.has(id)) delete g.nm[id]; });
  }
}

function hostTick() {
  const g = S.hg; if (!g || !S.isHost) return;
  const act = active(), ids = act.map(p => p.id), by = Object.fromEntries(act.map(p => [p.id, p]));
  const now = Date.now(), t = S.ht; let ch = false;
  if (g.ph === 'lobby') {
    const seats = ids.slice(0, g.cap);
    if (seats.join() !== g.seats.join()) { g.seats = seats; ch = true; }
  } else {
    const seats = g.seats.filter(id => by[id]);
    if (seats.length !== g.seats.length) { g.seats = seats; ch = true; }
    if (g.seats.length < 2) { g.ph = 'lobby'; g.seats = ids.slice(0, g.cap); ch = true; }
  }
  g.pend = g.pend || [];
  const pend = g.pend.filter(id => by[id] && !g.seats.includes(id));
  if (pend.length !== g.pend.length) { g.pend = pend; ch = true; }
  for (const id of g.seats.concat(g.pend)) { const n = by[id] && by[id].n; if (n && g.nm[id] !== n) { g.nm[id] = n; ch = true; } }
  if (g.ph === 'in') {
    if (t.k !== g.k) { t.k = g.k; t.dl = g.secs ? now + g.secs * 1000 + 900 : 0; }
    const all = g.seats.every(id => by[id] && by[id].d === g.k);
    if (all || (t.dl && now > t.dl)) { g.ph = 'rv'; t.rv = now; ch = true; }
  } else if (g.ph === 'rv') {
    if (t.k !== g.k || !t.rv) { t.k = g.k; t.rv = now; }
    const subs = g.seats.filter(id => by[id] && by[id].d === g.k);
    const allW = subs.every(id => by[id].w && by[id].w.k === g.k);
    const waitDrafts = now - t.rv > 1500; // give auto-submitted drafts a moment
    if ((allW && waitDrafts) || now - t.rv > (g.seats.length > 30 ? 6000 : 4000)) {
      const w = {};
      for (const id of g.seats) { const p = by[id]; w[id] = (p && p.w && p.w.k === g.k) ? String(p.w.t || '').slice(0, 16) : ''; }
      const cnt = {}; g.seats.forEach(id => { const v = norm(w[id]); if (v) cnt[v] = (cnt[v] || 0) + 1; });
      const top = Math.max(0, ...Object.values(cnt)), n = g.seats.length;
      const win = n >= 2 && (g.wr === 'maj' ? top * 2 > n : top === n);
      g.hist.push({ g: g.gid, r: g.r, w, win: win ? 1 : 0 });
      g.ph = win ? 'win' : 'res'; t.res = now; ch = true;
    }
  } else if (g.ph === 'res') {
    if (!t.res || t.k !== g.k) { t.k = g.k; t.res = now; }
    if (now - t.res > RES_MS) { nextRound(); return; }
  }
  if (ch) { fitG(g); pushMe(); render(); }
}
function nextRound() {
  const g = S.hg; if (!g) return;
  const here = new Set(active().map(p => p.id));
  const add = (g.pend || []).filter(id => here.has(id) && !g.seats.includes(id));
  if (add.length) { g.seats = g.seats.concat(add); g.cap = Math.min(MAXCAP, Math.max(g.cap, g.seats.length)); }
  g.pend = [];
  g.r++; g.k = g.gid + '.' + g.r; g.ph = 'in'; S.ht = {}; fitG(g); pushMe(); render(); }
function startGame() {
  const g = S.hg; if (!g) return;
  const ids = active().map(p => p.id);
  g.seats = ids.slice(0, g.cap);
  const extra = (g.pend || []).filter(id => ids.includes(id) && !g.seats.includes(id));
  if (extra.length) { g.seats = g.seats.concat(extra); g.cap = Math.min(MAXCAP, Math.max(g.cap, g.seats.length)); }
  if (g.seats.length < 2) { toast('至少要 2 人才能開始'); return; }
  g.gid = (g.gid || 0) + 1; g.r = 1; g.k = g.gid + '.1'; g.hist = []; g.pend = []; g.ph = 'in'; S.ht = {};
  fitG(g); pushMe(); render();
}
function toLobby() { const g = S.hg; if (!g) return; g.ph = 'lobby'; g.hist = []; g.pend = []; S.ht = {}; fitG(g); pushMe(); render(); }

/* ---------- sync on every peers change ---------- */
let syncT = null;
function onPeers(list) { S.peers = list; if (syncT) return; syncT = setTimeout(() => { syncT = null; sync(); render(); }, 60); }
function sync() {
  if (!S.tr) return;
  const act = active(), host = act[0];
  if (host) {
    if (host.id === S.id) {
      if (!S.isHost) { S.isHost = true; S.hg = S.g ? JSON.parse(JSON.stringify(S.g)) : newG(S.cap, S.secs, S.wr); S.ht = {}; pushMe(); }
    } else if (S.isHost && host.j < S.j) { S.isHost = false; pushMe(); }
  }
  const hp = act.find(p => p.g && p.id === (host && host.id)) || act.find(p => p.g);
  if (S.isHost) S.g = S.hg; else if (hp && hp.g) S.g = hp.g;
  const g = S.g; if (!g) return;
  for (const h of g.hist || []) {

    else if (window.claude && typeof window.claude.use === 'function') {
      const api = await Promise.race([window.claude.use('room'), sleep(10000).then(() => null)]);

  }

  try { history.replaceState(null, '', '#r-' + code); } catch (e) {}

  else { S.j = null; pushMe(); setTimeout(assignJ, 1600); }
  render();
}

  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  render();
}

}

function groups(entry) { // same-word groups, biggest first; blank answers kept apart
  const m = new Map(), empty = [];

  return { list: [...m.values()].sort((a, b) => b.ids.length - a.ids.length), empty };
}
const nmIn = (e, id) => id === S.id ? '你' : ((e.nm && e.nm[id]) || nameOf(id));
function nameList(e, ids, max) { const ns = ids.map(id => nmIn(e, id)); return ns.slice(0, max).join('、') + (ns.length > max ? ` 等 ${ns.length} 人` : ''); }

    const c = winKey ? ((winKey === '*' || gp.k === winKey) ? COLORS[0] : '') : colors[gp.k];
    const mine = gp.ids.includes(S.id);
    return `<div class="wc gw ${c ? 'm' : ''} ${mine ? 'mine' : ''}" style="animation-delay:${Math.min(i, 15) * 45}ms;${c ? 'background:' + c : ''}"><div class="w">${esc(gp.word)} <span class="cnt">×${gp.ids.length}</span></div><div class="who">${esc(nameList(e, gp.ids, 24))}</div></div>`;
  }).join('')}${empty.length ? `<div class="wc gw"><div class="w none">沒寫 ×${empty.length}</div><div class="who">${esc(nameList(e, empty, 24))}</div></div>` : ''}</div>`;
}
function wordChips(entry, matchColors) {
  if (!entry) return '';

    const { list, empty } = groups(entry);
    return `<div class="chips">${list.map(gp => { const c = matchColors && matchColors[gp.k]; return `<span class="chip ${c ? 'm' : ''}" ${c ? `style="background:${c}"` : ''}>${esc(gp.word)} <small style="${c ? 'color:rgba(255,255,255,.85)' : ''}">×${gp.ids.length}</small></span>`; }).join('')}${empty.length ? `<span class="chip"><span class="mut">沒寫 ×${empty.length}</span></span>` : ''}</div>`;
  }
  return `<div class="chips">${Object.keys(entry.w).map(id => {
    const w = entry.w[id], c = matchColors && matchColors[norm(w)];
    return `<span class="chip ${c ? 'm' : ''}" ${c ? `style="background:${c}"` : ''}><small style="${c ? 'color:rgba(255,255,255,.85)' : ''}">${esc((entry.nm && entry.nm[id]) || nameOf(id))}</small>${w ? esc(w) : '<span class="mut">（沒寫）</span>'}</span>`;
  }).join('')}</div>`;
}

  const out = {}; let i = 0; Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).forEach(n => { if (cnt[n] >= 2) out[n] = COLORS[i++ % COLORS.length]; });

}

  if (g.ph === 'win') {
    const gl = groups(e).list;

function renderPlayers() {
  const el = document.getElementById('players'); if (!el) return;
  const g = S.g, act = active(), joining = S.peers.filter(p => !p.j);
  const hostId = act[0] && act[0].id;
  const seats = g ? g.seats : [];
  document.getElementById('ptitle').textContent = g ? `玩家 ${seats.length} / ${g.cap}` : '玩家';
  const big = act.length + joining.length > BIG;
  el.classList.toggle('compact', big);
  if (big) {
    el.innerHTML = act.map(p => {
      const seated = seats.includes(p.id), done = g && g.ph === 'in' && p.d === g.k;
      const pd = !seated && g && (g.pend || []).includes(p.id), canPick = !seated && S.isHost && g && g.ph !== 'lobby';
      return `<li class="${seated ? '' : (pd ? 'pend' : 'spec')} ${done ? 'done' : ''} ${canPick ? 'pick' : ''}" ${canPick ? `data-a="pend" data-id="${esc(p.id)}"` : ''} title="${seated ? '' : (pd ? '下輪加入' : '觀戰')}"><span class="av" style="background:${colorOf(p.id)}">${esc((p.n || '?').slice(0, 1))}</span>${esc(p.n || '？')}${p.id === hostId ? ' ★' : ''}${p.id === S.id ? '（你）' : ''}${done ? ' ✓' : ''}${pd ? ' ↪下輪' : (canPick ? ' ＋' : '')}</li>`;
    }).concat(joining.map(p => `<li class="spec">${esc(p.n || '？')}…</li>`)).join('');
    return;
  }
  const rows = act.map(p => {
    const seated = seats.includes(p.id);
    let st = '';
    if (!g) st = '';
    else if (!seated) {
      const pd = (g.pend || []).includes(p.id);
      st = (S.isHost && g.ph !== 'lobby') ? `<button class="btn small ${pd ? 'ghost' : 'primary'}" data-a="pend" data-id="${esc(p.id)}">${pd ? '取消' : '下輪加入'}</button>`
         : `<span class="st">${pd ? '下輪加入' : '觀戰'}</span>`;
      if (pd && S.isHost && g.ph !== 'lobby') st = '<span class="st ok" style="margin-right:6px">下輪加入</span>' + st;
    }
    else if (g.ph === 'in') st = p.d === g.k ? '<span class="st ok">已送出 ✓</span>' : '<span class="st">思考中…</span>';
    else if (g.ph === 'lobby') st = '<span class="st ok">已入座</span>';
    return `<li><span class="av" style="background:${colorOf(p.id)}">${esc((p.n || '?').slice(0, 1))}</span><span class="nm">${esc(p.n || '？')}${p.id === hostId ? '<span class="tag h">房主</span>' : ''}${p.id === S.id ? '<span class="tag">你</span>' : ''}</span>${st}</li>`;
  }).concat(joining.map(p => `<li><span class="av" style="background:#bbb">${esc((p.n || '?').slice(0, 1))}</span><span class="nm">${esc(p.n || '？')}${p.id === S.id ? '<span class="tag">你</span>' : ''}</span><span class="st">加入中…</span></li>`));
  el.innerHTML = rows.join('') || '<li class="mut">連線中…</li>';
}

function renderHist() {
  const el = document.getElementById('hist'); const g = S.g; if (!el) return;
  if (!g || g.ph === 'lobby') { if (S.histKey !== 'none') { el.innerHTML = ''; S.histKey = 'none'; } return; }
  const list = Object.values(S.hist).filter(h => h.g === g.gid).sort((a, b) => b.r - a.r);
  const key = g.gid + ':' + list.map(h => h.r + (h.win ? (h.hd ? 'd' : 'w') : '')).join(',');
  if (key === S.histKey) return; S.histKey = key;
  el.innerHTML = list.length ? `<div class="card hist"><h2>歷史紀錄</h2>${list.map(h => `<div class="h"><div class="rn">第 ${h.r} 輪${h.win ? (h.hd ? '・房主判定通關 🎉' : '・相遇 🎉') : ''}</div>${wordChips(h, groupColors(h).colors)}</div>`).join('')}</div>` : '';
}

function tickUI() {
  const g = S.g; if (!g || S.view !== 'room') return;
  if (g.ph === 'in' && g.secs) {
    const start = S.seenAt[g.k] || Date.now(), left = Math.max(0, g.secs * 1000 - (Date.now() - start));
    const t = document.getElementById('timer'); if (t) { t.textContent = Math.ceil(left / 1000) + ' 秒'; t.classList.toggle('low', left < 10000); }
    const b = document.getElementById('tbar'); if (b) b.style.width = (100 * left / (g.secs * 1000)) + '%';
  } else if (g.ph === 'in') { const t = document.getElementById('timer'); if (t) t.textContent = '不限時'; }
  if (g.ph === 'res') {
    if (!S.seenAt['res' + g.k]) S.seenAt['res' + g.k] = Date.now();
    const b = document.getElementById('nbar'); if (b) b.style.width = Math.min(100, 100 * (Date.now() - S.seenAt['res' + g.k]) / RES_MS) + '%';
  }
}
setInterval(() => { if (S.isHost) hostTick(); tickUI(); }, 250);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'cap-' || a === 'cap+') { const n = document.getElementById('name'); if (n) S.name = n.value; S.cap = Math.max(2, Math.min(MAXCAP, S.cap + (a === 'cap+' ? 1 : -1))); render(); }
  else if (a === 'secs') { const n = document.getElementById('name'); if (n) S.name = n.value; S.secs = +b.dataset.v; render(); }
  else if (a === 'create') enter(rid(4), true);
  else if (a === 'join') { const c = (document.getElementById('code').value || '').trim().toLowerCase(); enter(c, false); }
  else if (a === 'clearhash') { e.preventDefault(); try { history.replaceState(null, '', location.pathname + location.search); } catch (x) {} render(); }
  else if (a === 'leave') leave();
  else if (a === 'copy') copyCode();
  else if (a === 'hcap-' || a === 'hcap+') setOpt('cap', Math.max(2, Math.min(MAXCAP, S.hg.cap + (a === 'hcap+' ? 1 : -1))));
  else if (a === 'hsecs') setOpt('secs', +b.dataset.v);
  else if (a === 'hwr') setOpt('wr', b.dataset.v);
  else if (a === 'start' || a === 'again') startGame();
  else if (a === 'lobby') toLobby();
  else if (a === 'next') nextRound();
  else if (a === 'pend') togglePend(b.dataset.id);
  else if (a === 'declare') declareWin();
  else if (a === 'submit') submitWord();
  else if (a === 'unsub') unsubmit();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || S.view !== 'home') return;
  if (e.target && e.target.id === 'code') { e.preventDefault(); document.querySelector('[data-a="join"]').click(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'capr' || e.target.id === 'hcapr') { const b = e.target.parentNode.querySelector('.stepper b'); if (b) b.textContent = e.target.value; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'capr') { const n = document.getElementById('name'); if (n) S.name = n.value; S.cap = +e.target.value; render(); }
  else if (e.target.id === 'hcapr') setOpt('cap', +e.target.value);
});
window.addEventListener('hashchange', () => { if (S.view === 'home') render(); });
render();
</script>
</body>
</html>
